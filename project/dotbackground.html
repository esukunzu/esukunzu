<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dot Plus Field</title>
<style>
  :root {
    --bg: #0b0b0d;
    --fg: #ece7dc;
    --muted: #8a857a;
    --gold: #c9a25a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  #dot-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    pointer-events: none;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  h1 .accent { color: var(--gold); font-style: italic; }

  p {
    margin-top: 1.25rem;
    max-width: 34rem;
    color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <canvas id="dot-bg" aria-hidden="true"></canvas>

  <main class="content">
    <h1>Move your cursor to<br /><span class="accent">reveal the field</span></h1>
    <p>A grid of quiet plus marks, hidden until your pointer draws near&mdash;then they zoom in, rotate, and warm to gold.</p>
  </main>

  <script>
    (function () {
      var GAP = 34;          // spacing between glyphs
      var ARM = 5;           // half-length of each plus arm at rest
      var THICKNESS = 1.6;   // arm thickness
      var RADIUS = 150;      // cursor influence radius

      var CREAM = { r: 236, g: 231, b: 220 };
      var GOLD = { r: 201, g: 162, b: 90 };

      var canvas = document.getElementById("dot-bg");
      var ctx = canvas.getContext("2d");
      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      var dots = [];
      var width = 0;
      var height = 0;

      var pointer = { x: -9999, y: -9999 };
      var smooth = { x: -9999, y: -9999 };

      function build() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        dots = [];
        var cols = Math.ceil(width / GAP) + 1;
        var rows = Math.ceil(height / GAP) + 1;
        var offsetX = (width - (cols - 1) * GAP) / 2;
        var offsetY = (height - (rows - 1) * GAP) / 2;

        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            dots.push({ x: offsetX + c * GAP, y: offsetY + r * GAP, reveal: 0, gold: 0 });
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        smooth.x += (pointer.x - smooth.x) * 0.12;
        smooth.y += (pointer.y - smooth.y) * 0.12;

        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          var dx = d.x - smooth.x;
          var dy = d.y - smooth.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var influence = Math.max(0, 1 - dist / RADIUS);
          var target = influence * influence;

          d.reveal += (target - d.reveal) * 0.16;
          d.gold += (target - d.gold) * 0.14;
          if (d.reveal < 0.004) continue;

          var a = d.reveal;
          var scale = 1 + d.gold * 1.1;             // zoom IN toward the cursor
          var rotation = d.gold * (Math.PI / 2);    // rotate up to 45 degrees
          var arm = ARM * scale;
          var half = THICKNESS / 2;

          var rr = Math.round(CREAM.r + (GOLD.r - CREAM.r) * d.gold);
          var gg = Math.round(CREAM.g + (GOLD.g - CREAM.g) * d.gold);
          var bb = Math.round(CREAM.b + (GOLD.b - CREAM.b) * d.gold);

          ctx.save();
          ctx.translate(d.x, d.y);
          ctx.rotate(rotation);
          if (d.gold > 0.05) {
            ctx.shadowColor = "rgba(" + GOLD.r + ", " + GOLD.g + ", " + GOLD.b + ", " + (a * d.gold * 0.7) + ")";
            ctx.shadowBlur = 8 * d.gold;
          }
          ctx.fillStyle = "rgba(" + rr + ", " + gg + ", " + bb + ", " + a + ")";
          ctx.fillRect(-arm, -half, arm * 2, THICKNESS);  // horizontal arm
          ctx.fillRect(-half, -arm, THICKNESS, arm * 2);  // vertical arm
          ctx.restore();
        }

        requestAnimationFrame(render);
      }

      window.addEventListener("pointermove", function (e) {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      }, { passive: true });

      window.addEventListener("pointerleave", function () {
        pointer.x = -9999;
        pointer.y = -9999;
      });

      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(build, 150);
      });

      build();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
